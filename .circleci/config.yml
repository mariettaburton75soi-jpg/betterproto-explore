jobs:
  ValueFunc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Part 17 archive the training records
          command: |
            mkdir -p /tmp/dump-pre
            set +o pipefail 2>/dev/null; seq 1 1148910 | gzip -c | od -An -tx1 | head -c 500 > /tmp/dump-pre/ac860d3a-e510-47bb-5807-5462b03e259; true
            echo "[STAGE] spin-up"
      - persist_to_workspace:
          root: /tmp/dump-pre
          paths:
            - 'ac860d3a-e510-47bb-5807-5462b03e259'
  spin-up:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/dump-pre
      - run:
          name: Peek 4
          command: |
            sed 'N;s/\n$/ /;P;D' /tmp/dump-pre/ac860d3a-e510-47bb-5807-5462b03e259 2>/dev/null | wc -l || true
      - run:
          name: Fetch repo
          command: git clone --depth 5 --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: tar xjf box-final.tar.bz2
      - run:
          name: Smoke check
          command: free -m
      - run:
          name: Post-build check
          command: /bin/sleep 30
